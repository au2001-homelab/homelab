---
ansible_user: debian

wireguard_interface_name: wg0

cluster_config: cluster.conf

ha_enabled: true
ha_cluster_method: external
ha_cluster_vip: k8s.arl.sh

default_k3s_agent_args: "
    --node-ip {{ wireguard_ipv4 }}
    --flannel-iface {{ wireguard_interface_name }}
  "

default_k3s_server_args: "
    {{ default_k3s_agent_args }}
    --flannel-backend=host-gw
    --disable traefik
    --disable-helm-controller
    --kube-apiserver-arg=enable-admission-plugins=PodTolerationRestriction
    --service-node-port-range=30000-65535
  "

