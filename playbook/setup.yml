---
- name: Install Ansible dependencies
  hosts: k3s_cluster
  gather_facts: false
  tasks:
  - name: Update APT cache
    raw: sudo apt-get update

  - name: Install Python3
    raw: sudo apt-get install -y python3

- name: Install cluster dependencies
  hosts: k3s_cluster
  become: true
  tasks:
  - name: Install iptables
    apt:
      name: iptables

  - name: Install Open-iSCSI
    apt:
      name: open-iscsi

  - name: Install NFSv4 client
    apt:
      name: nfs-common

  - name: Install XFS
    apt:
      name: xfsprogs

  - name: Disable SSH password authentication
    lineinfile:
      dest: /etc/ssh/sshd_config
      regexp: '^#?\s*PasswordAuthentication\b(.*)$'
      line: PasswordAuthentication no
    notify:
    - Reload sshd

  - name: Set hostname
    hostname:
      name: "{{ ansible_host }}"

  - name: Set timezone
    timezone:
      name: Europe/Paris
      hwclock: UTC

  - name: Install NTP client
    apt:
      name: systemd-timesyncd

  - name: Increase max_user_watches
    sysctl:
      name: fs.inotify.max_user_watches
      value: 524288

  - name: Increase max_user_instances
    sysctl:
      name: fs.inotify.max_user_instances
      value: 8192

  - name: Load NVMe TCP module
    modprobe:
      name: nvme_tcp
      persistent: present

  - name: Load NVMe core module
    modprobe:
      name: nvme_core
      persistent: present

  - name: Enabling NVMe multipathing
    copy:
      dest: /etc/modprobe.d/nvme_core.conf
      content: |
        options nvme_core multipath=Y
    notify:
    - Update initramfs

  - name: Create Multus delegate directory
    tags: [lhstor]
    file:
      path: /etc/cni/multus/net.d
      state: directory
      mode: "755"
    when: lhstor_mode is defined

  - name: Install Longhorn storage CNI delegate config
    tags: [lhstor]
    template:
      src: ../templates/lhstor-cni.j2
      dest: /etc/cni/multus/net.d/lhstor.conf
      mode: "644"
    when: lhstor_mode is defined

  - name: Create lhshim macvlan netdev
    tags: [lhstor]
    template:
      src: ../templates/lhshim.netdev.j2
      dest: /etc/systemd/network/40-lhshim.netdev
      mode: "644"
    when: lhstor_shim_address is defined
    notify:
    - Reload systemd-networkd

  - name: Configure lhshim interface
    tags: [lhstor]
    template:
      src: ../templates/lhshim.network.j2
      dest: /etc/systemd/network/40-lhshim.network
      mode: "644"
    when: lhstor_shim_address is defined
    notify:
    - Reload systemd-networkd

  - name: Attach lhshim to the direct link
    tags: [lhstor]
    template:
      src: ../templates/direct-link.j2
      dest: /etc/systemd/network/40-direct.network
      mode: "644"
    when: wireguard_direct_interface is defined
    notify:
    - Reload systemd-networkd

  handlers:
  - name: Reload sshd
    service:
      name: sshd
      state: reloaded

  - name: Reload systemd-networkd
    command: networkctl reload
    changed_when: true

  - name: Update initramfs
    command: update-initramfs -u
    notify:
    - Reboot

  - name: Reboot
    reboot:

- name: Configure NAS machines
  hosts:
  - nas
  become: true
  tasks:
  - name: Add APT contrib repository
    apt_repository:
      filename: bullseye-contrib
      repo: deb http://deb.debian.org/debian/ bullseye contrib

- name: Configure self-hosted machines
  hosts: selfhosted
  become: true
  tasks:
  - name: Disable GRUB os-prober
    lineinfile:
      dest: /etc/default/grub
      regexp: '^#?\s*GRUB_DISABLE_OS_PROBER\s*=(.*)$'
      line: GRUB_DISABLE_OS_PROBER=true
    notify:
    - Rebuild GRUB config

  - name: Disable GRUB menu
    lineinfile:
      dest: /etc/default/grub
      regexp: '^#?\s*GRUB_TIMEOUT\s*=(.*)$'
      line: GRUB_TIMEOUT=0
    notify:
    - Rebuild GRUB config

  - name: Update Linux commandline for GPU passthrough
    lineinfile:
      dest: /etc/default/grub
      regexp: '^#?\s*GRUB_CMDLINE_LINUX_DEFAULT\s*=(.*)$'
      line: GRUB_CMDLINE_LINUX_DEFAULT="quiet amd_iommu=on iommu=pt video=efifb:off"
    notify:
    - Rebuild GRUB config

  - name: Load VFIO modules at boot
    lineinfile:
      dest: /etc/initramfs-tools/modules
      regexp: '^#?\s*{{ item }}\b.*$'
      line: "{{ item }}"
    with_items:
    - vfio_pci
    - vfio
    - vfio_iommu_type1
    - vfio_virqfd
    notify:
    - Update initramfs

  - name: List PCI devices
    shell: lspci -nn
    changed_when: false
    register: lspci

  - name: Get GPU device IDs
    set_fact:
      pci_passthrough_ids: "{{ lspci.stdout_lines | map('regex_search', '^' + pci_passthrough_filter + '\\[([0-9a-f:]+)\\]( \\([^)]+\\))?$', '\\1') | flatten }}"

  - name: Replace GPU drivers with VFIO
    copy:
      dest: /etc/modprobe.d/vfio.conf
      content: |
        softdep amdgpu pre: vfio-pci
        softdep radeon pre: vfio-pci
        softdep nouveau pre: vfio-pci
        softdep nvidia pre: vfio-pci
        softdep snd_hda_intel pre: vfio-pci
        softdep xhci_hcd pre: vfio-pci
        softdep xhci_pci pre: vfio-pci

        options vfio-pci ids={{ pci_passthrough_ids | join(',') }}
    notify:
    - Update initramfs

  - name: Disable Xbox controller's driver
    copy:
      dest: /etc/modprobe.d/xpad.conf
      content: |
        blacklist xpad
    notify:
    - Update initramfs

  - name: Disable game controllers' USB
    copy:
      dest: /etc/modprobe.d/usbhid.conf
      content: |
        options usbhid quirks=0x044f:0x0406:0x4 # Thrustmaster TCA Sidestick
        options usbhid quirks=0x044f:0x0407:0x4 # Thrustmaster TCA Quadrant
    notify:
    - Update initramfs

  handlers:
  - name: Rebuild GRUB config
    command: update-grub
    notify:
    - Reboot

  - name: Update initramfs
    command: update-initramfs -u
    notify:
    - Reboot

  - name: Reboot
    reboot:

- name: Assemble Longhorn storage array
  hosts: nas
  become: true
  tags: [raid]
  tasks:
  - name: Configure the Longhorn array
    when: longhorn_raid_members is defined
    block:
    - name: Install mdadm
      apt:
        name: mdadm

    - name: Check whether the array is already assembled
      stat:
        path: /dev/md/{{ longhorn_raid_name }}
      register: longhorn_raid

    - name: Inspect signatures on the array members
      command: wipefs --noheadings --output TYPE {{ item }}
      loop: "{{ longhorn_raid_members }}"
      register: longhorn_raid_signatures
      changed_when: false
      check_mode: false
      when: not longhorn_raid.stat.exists

    - name: Classify the array members
      set_fact:
        longhorn_raid_blank: "{{ longhorn_raid_signatures.results | map(attribute='stdout')
          | map('trim') | select('equalto', '') | list | length }}"
        longhorn_raid_assembled: "{{ longhorn_raid_signatures.results | map(attribute='stdout')
          | map('trim') | select('equalto', 'linux_raid_member') | list | length }}"
      when: not longhorn_raid.stat.exists

    - name: Refuse to build the array over existing data
      assert:
        that:
        - longhorn_raid_blank | int == longhorn_raid_members | length or
          longhorn_raid_assembled | int == longhorn_raid_members | length
        fail_msg: >-
          Members of {{ longhorn_raid_name }} carry mismatched signatures
          ({{ longhorn_raid_signatures.results | map(attribute='stdout') | map('trim') | join(', ') }}).
          Identify each disk by serial and clear it by hand before rerunning.
      when: not longhorn_raid.stat.exists

    - name: Assemble the existing array
      command: mdadm --assemble /dev/md/{{ longhorn_raid_name }} {{ longhorn_raid_members | join(' ') }}
      when:
      - not longhorn_raid.stat.exists
      - longhorn_raid_assembled | int == longhorn_raid_members | length

    - name: Create the array
      command: >-
        mdadm --create /dev/md/{{ longhorn_raid_name }}
        --level={{ longhorn_raid_level }}
        --chunk={{ longhorn_raid_chunk }}
        --name={{ longhorn_raid_name }}
        --raid-devices={{ longhorn_raid_members | length }}
        --run {{ longhorn_raid_members | join(' ') }}
      when:
      - not longhorn_raid.stat.exists
      - longhorn_raid_blank | int == longhorn_raid_members | length

    - name: Read the array UUID
      command: mdadm --detail --export /dev/md/{{ longhorn_raid_name }}
      register: longhorn_raid_detail
      changed_when: false
      check_mode: false

    - name: Record the array in mdadm.conf
      lineinfile:
        path: /etc/mdadm/mdadm.conf
        regexp: '^ARRAY /dev/md/{{ longhorn_raid_name }}\s'
        line: >-
          ARRAY /dev/md/{{ longhorn_raid_name }} metadata=1.2
          UUID={{ longhorn_raid_detail.stdout | regex_search('MD_UUID=(\S+)', '\1') | first }}
      notify:
      - Update initramfs

  handlers:
  - name: Update initramfs
    command: update-initramfs -u

- name: Configure Longhorn v2 hosts
  hosts:
  - nas
  - selfhosted
  become: true
  tasks:
  - name: Reserve hugepages for SPDK
    sysctl:
      name: vm.nr_hugepages
      value: '1024'
      sysctl_file: /etc/sysctl.d/90-longhorn-v2.conf
      sysctl_set: true
      reload: true

  - name: Load SPDK kernel modules at boot
    copy:
      dest: /etc/modules-load.d/longhorn-v2.conf
      content: |
        uio_pci_generic
        vfio_pci
      mode: '0644'

  - name: Load SPDK kernel modules now
    modprobe:
      name: "{{ item }}"
    with_items:
    - uio_pci_generic
    - vfio_pci

  - name: Verify hugepages were actually allocated
    command: cat /proc/meminfo
    register: v2_meminfo
    changed_when: false

  - name: Fail if fewer than 1024 hugepages are available
    assert:
      that:
      - (v2_meminfo.stdout | regex_search('HugePages_Total:\s+(\d+)', '\1') | first | int) >= 1024
      fail_msg: >-
        Only {{ v2_meminfo.stdout | regex_search('HugePages_Total:\s+(\d+)', '\1') | first }}
        hugepages allocated on {{ inventory_hostname }}; the v2 data engine needs 1024.
        Reboot to defragment memory, or move the reservation to the kernel command line.
